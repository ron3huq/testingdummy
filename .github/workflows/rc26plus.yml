name: FULL8 RC26 PLUS (face NR17 + ball trajectory)
on:
  push:
    branches: [claude/vigilant-albattani-3r4gnp]
    paths: [.github/workflows/rc26plus.yml, rc26plus/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned FULL8 RC26
        run: |
          curl --fail --location --retry 5 -o RC26.zip https://github.com/ron3huq/testingdummy/releases/download/releasee/FULL8-RC26-TRANSFER-RESTORE.zip
          echo "9873772a203064b1043f6973153d41e0bc147d74bb1f1e5e893a18bef120245f  RC26.zip" | sha256sum -c
      - name: Build RC26 PLUS
        run: |
          mkdir payload
          unzip -q RC26.zip 'assets/*' classes5.dex -d payload
          rm RC26.zip
          unzip -o -q rc26plus/RC26PLUS-DELTA.zip -d payload
          (cd payload && sha256sum -c ../rc26plus/delta.sha256)
          cp rc26plus/README-VI.md payload/README-RC26-PLUS-VI.md
          mkdir -p addon/assets
          mv payload/assets/dt270_mobile_all.cpk addon/assets/
          cp rc26plus/README-VI.md addon/README-QUY-DAO-VI.md
          du -sh payload addon
      - uses: actions/upload-artifact@v4
        with:
          name: FULL8-RC26-PLUS-FACE
          path: payload/
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: ADDON-QUY-DAO-dt270-CHEP-KHONG-NEN
          path: addon/
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
