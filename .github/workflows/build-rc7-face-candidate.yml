name: UCL core checks only - old face candidate withdrawn
on:
  push:
    branches: [73-rc7-ronaldo-facefix-ucl-core-20261105]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check UCL state core, not native game integration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python source/repair-full8-rc9-ucl/test_ucl.py
