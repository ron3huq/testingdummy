name: UCL core checks only - old face candidate withdrawn
on:
  push:
    branches: [73-rc7-ronaldo-facefix-ucl-core-20261105]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check UCL state core, not native game integration
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python source/repair-full8-rc9-ucl/test_ucl.py
          python source/repair-full8-rc9-ucl/test_ucl_single_leg.py
          python source/repair-full8-rc9-ucl/test_ucl_stats.py
          python source/repair-full8-rc9-ucl/test_ucl_native_result.py
          python source/repair-full8-rc9-ucl/test_ucl_controller.py
          python source/repair-full8-rc9-ucl/test_ucl_install.py
          python source/repair-full8-rc9-ucl/test_ucl_pool.py
          python source/repair-full8-rc9-ucl/test_ucl_probability.py
      - name: Check UCL launcher source syntax
        run: node --check source/repair-full8-rc11-ucl-entry/launcher/ucl.js
