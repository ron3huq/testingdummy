name: RC22 FULL download
on:
  push:
    branches: [rc22-full-download]
    paths: [.github/workflows/rc22-full.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact RC7 baseline
        run: curl --fail --location --retry 3 'https://github.com/ron3huq/testingdummy/releases/download/releasee/FULL8-RC7-complete-APK73.zip' --output RC7-baseline.zip
      - name: Reconstruct and verify every payload file
        run: python3 _ci/reconstruct.py
      - name: Upload FULL payload as one flat ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FULL8-RC22-RC7BASE-V25-EVENT-RONALDO2027
          path: payload/
          include-hidden-files: true
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
