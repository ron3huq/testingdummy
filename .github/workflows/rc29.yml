name: RC29 (V32 Master League + RC26 for V19.1)
on:
  push:
    branches: [claude/vigilant-albattani-3r4gnp]
    paths: [.github/workflows/rc29.yml, rc29/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h .
      - name: Download pinned inputs from release
        run: |
          B=https://github.com/ron3huq/testingdummy/releases/download/releasee
          for f in 73efootball-V32-r2.part1.rar 73efootball-V32-r2.part2.rar FULL8-RC26-TRANSFER-RESTORE.zip; do
            curl --fail --location --retry 5 -o "$f" "$B/$f"
          done
          printf '%s\n' \
            "7c10704b156cb92cc5a29c768e28431d7a8cc1f4de19a31e0f82c0d174920e74  73efootball-V32-r2.part1.rar" \
            "8c446816c141b21c56984e9a528c1e24c04034a10f24582bbf3eb68f4672fc4a  73efootball-V32-r2.part2.rar" \
            "9873772a203064b1043f6973153d41e0bc147d74bb1f1e5e893a18bef120245f  FULL8-RC26-TRANSFER-RESTORE.zip" | sha256sum -c
          7z x -y 73efootball-V32-r2.part1.rar > /dev/null
          rm 73efootball-V32-r2.part*.rar
          mv 73efootball-V32-r2.apk V32.apk
          mv FULL8-RC26-TRANSFER-RESTORE.zip RC26.zip
      - name: Reconstruct and verify every file
        run: |
          mkdir -p out
          python3 rc29/reconstruct.py --artifact
          rm -f V32.apk RC26.zip
          test ! -e payload/assets/dt270_mobile_all.cpk && test ! -e payload/assets/dt500_mobile_all.cpk && test ! -e payload/assets/pc0010_mobile_and.ucas
          du -sh payload payload-data
      - name: Upload part 1 (core)
        uses: actions/upload-artifact@v4
        with:
          name: FULL8-RC29-V32-ML-part1-core
          path: payload/
          compression-level: 6
          if-no-files-found: error
          retention-days: 30
      - name: Upload part 2 (data)
        uses: actions/upload-artifact@v4
        with:
          name: FULL8-RC29-V32-ML-part2-data
          path: payload-data/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
