<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#100d17">
<title>Private Football</title>
<link rel="stylesheet" href="launcher.css">
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="private.css">
</head>
<body>
<main class="shell" id="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="22 16 64 76" fill="currentColor"><polygon points="54,18 82,34 54,50 26,34" opacity=".95"/><polygon points="26,38 52,53 52,90 26,74" opacity=".55"/><polygon points="82,38 56,53 56,90 82,74" opacity=".78"/></svg></div>
    <div class="brand">
      <div class="name"><b id="title">Private Football</b><span id="ver"></span></div>
      <p id="subtitle"></p>
    </div>
  </header>

  <section class="strip" aria-live="polite">
    <div class="line"><i class="dot"></i><p id="status"></p></div>
    <div class="meter" id="meter"><i></i></div>
    <p class="progress" id="progress"></p>
  </section>

  <section class="page" id="home">
    <button class="launch" id="enter" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,4 20,12 7,20"/></svg>
      <span data-t="进入游戏"></span>
    </button>
    <div class="foot"><button class="link" id="private-diagnostics" type="button">Diagnostics</button>
      <button class="link" id="repair" type="button"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg><span data-t="重新检查并修复资源"></span></button>
    </div>
    <div class="home-sum" id="home-sum" hidden><i></i><span id="home-sum-text"></span></div>
    <div class="home-recent" id="home-recent" hidden><p class="sec-h" data-t="最近查看"></p><div class="home-recent-row" id="home-recent-row"></div></div>
    <p class="sec-h" data-t="快捷入口"></p>
    <div class="quick-grid">
<button class="quick" id="private-transfer" type="button"><svg viewBox="0 0 24 24"><path d="M4 8h16l-4-4M20 16H4l4 4"/></svg><b>Transfer</b><small>UEFA · World · Y08 · Y17</small></button>
      <button class="quick" data-go="players" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><b data-t="球员编辑器"></b><small data-t="培养、技能、增能、全库选人"></small></button>
      <button class="quick" data-go="cards" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-9 9"/></svg><b data-t="制卡工坊"></b><small data-t="背景、卡面与球员属性"></small></button>
      <button class="quick" data-go="saves" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v6h8V4M8 20v-6h8v6"/></svg><b data-t="存档管理"></b><small data-t="升级、去重、导入导出"></small></button>
      <button class="quick" data-go="storage" type="button"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg><b data-t="存储清理"></b><small data-t="扫描占用与回收空间"></small></button>
    </div>
    <details class="tips" id="tips">
      <summary data-t="使用提示"></summary>
      <p data-t="培养加点 / 状态 ABCD / 技能与增能 / 全数据库选人"></p>
      <p data-t="资源缺失：安装离线资源包后进入游戏，自动导入。\n资源完整：直接进入。覆盖更新保留资源与存档；请勿清除数据或卸载主游戏。"></p>
      <p class="hl" data-t="如果遇到载入资源卡住的情况，请切一下到资源安装包到前台再切回去。\n如果游戏进入黑屏退出再进一次即可"></p>
      <button class="link" id="native-launcher" type="button">Compatibility interface</button>
    </details>
  </section>

  <section class="page" id="players" hidden><div id="ed-root"></div><button class="link" id="native-editor" type="button">Open native player editor</button></section>

  <section class="page" id="cards" hidden>
    <div class="hero-card">
      <h2 data-t="DIY 制卡（背景与卡面）"></h2>
      <p data-t="导入图片、选择背景、设置球员属性，一键生成独立球员。作品保存在本机。"></p>
      <div class="chips-row"><span data-t="导入图片"></span><span data-t="选背景"></span><span data-t="球员属性"></span><span data-t="生成入库"></span></div>
      <button class="row hot" id="open-designer" type="button"><span class="row-t"><b data-t="DIY 制卡（背景与卡面）"></b><small data-t="打开制卡工坊"></small></span></button>
    </div>
  </section>

  <section class="page" id="saves" hidden>
    <div class="list">
      <button class="row hot" id="max-level" type="button"><span class="row-t"><b data-t="未满级球员一键升级并加点"></b><small data-t="把未满级球员升到上限并自动加点"></small></span></button>
      <button class="row" id="dedupe" type="button"><span class="row-t"><b data-t="清理未满级重复球员"></b><small data-t="先预览，再删除未满级的重复球员，自动备份"></small></span></button>
      <button class="row" id="export" type="button"><span class="row-t"><b data-t="导出存档"></b><small data-t="生成 .efsave 备份文件，可随时恢复"></small></span></button>
      <button class="row" id="import" type="button"><span class="row-t"><b data-t="导入存档"></b><small data-t="替换当前进度，导入前自动备份"></small></span></button>
    </div>
    <p class="note" data-t="导入将替换当前进度；只接受本程序导出的 .efsave 文件。\n进入游戏后，请关闭游戏并重新打开，再管理存档。"></p>
  </section>

  <section class="page" id="storage" hidden>
    <div class="list">
      <button class="row hot" id="open-storage" type="button"><span class="row-t"><b data-t="存储管理 · 扫描与清理"></b><small data-t="扫描占用，预览后选择性清理"></small></span></button>
      <button class="row" id="repair2" type="button"><span class="row-t"><b data-t="重新检查并修复资源"></b><small data-t="重新核对并补齐游戏资源"></small></span></button>
    </div>
  </section>
</main>

<nav class="dock" id="dock" aria-label="Navigation">
  <button data-page="home" class="on" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span data-t="Home"></span></button>
  <button data-page="players" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span data-t="Players"></span></button>
  <button data-page="cards" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span data-t="Cards"></span></button>
  <button data-page="saves" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v6h8V4M8 20v-6h8v6"/></svg><span data-t="Saves"></span></button>
  <button data-page="storage" type="button"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg><span data-t="Storage"></span></button>
</nav>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <p class="body" id="sheet-body"></p>
    <div id="sheet-extra"></div>
    <div class="row-actions" id="sheet-actions"></div>
  </div>
</div>

<script src="launcher-startup.js"></script>
<script src="ui-locales.js"></script>
<script src="english-words.js"></script>
<script src="ui-localization.js"></script>
<script src="editor-core.js"></script>
<script src="editor-util.js"></script>
<script src="editor-store.js"></script>
<script src="editor-ui.js"></script>
<script src="editor-dev.js"></script>
<script src="editor-pos.js"></script>
<script src="editor-misc.js"></script>
<script src="editor-catalog.js"></script>
<script src="editor-compare.js"></script>
<script src="editor-private.js"></script>
<script src="editor-detail.js"></script>
<script src="editor-list.js"></script>
<script src="launcher.js"></script>
</body>
</html>
