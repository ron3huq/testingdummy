<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071724">
<title>Private Football · Earth</title>
<link rel="stylesheet" href="launcher.css">
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="private.css">
<link rel="stylesheet" href="earth.css">
</head>
<body>
<main class="shell" id="app">
  <header class="top">
    <div class="logo" aria-hidden="true"><svg viewBox="22 16 64 76" fill="currentColor"><polygon points="54,18 82,34 54,50 26,34" opacity=".95"/><polygon points="26,38 52,53 52,90 26,74" opacity=".55"/><polygon points="82,38 56,53 56,90 82,74" opacity=".78"/></svg></div>
    <div class="brand">
      <div class="name"><b id="title">Private Football</b><span id="ver"></span></div>
      <p id="subtitle"></p>
    </div>
  </header>

  <section class="strip" aria-live="polite">
    <div class="line"><i class="dot"></i><p id="status"></p></div>
    <div class="meter" id="meter"><i></i></div>
    <p class="progress" id="progress"></p>
  </section>

  <section class="page" id="home">
    <button class="launch" id="enter" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,4 20,12 7,20"/></svg>
      <span data-t="Enter Game"></span>
    </button>
    <div class="foot"><button class="link" id="private-diagnostics" type="button">Diagnostics</button>
      <button class="link" id="repair" type="button"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/></svg><span data-t="Check & Repair Resources"></span></button>
    </div>
    <div class="home-sum" id="home-sum" hidden><i></i><span id="home-sum-text"></span></div>
    <div class="home-recent" id="home-recent" hidden><p class="sec-h" data-t="Recently viewed"></p><div class="home-recent-row" id="home-recent-row"></div></div>
    <p class="sec-h" data-t="Shortcuts"></p>
    <div class="quick-grid">
<button class="quick" id="private-transfer" type="button"><svg viewBox="0 0 24 24"><path d="M4 8h16l-4-4M20 16H4l4 4"/></svg><b>Transfer</b><small>UEFA · World · Y08 · Y17</small></button>
      <button class="quick" data-go="players" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><b data-t="Player editor"></b><small data-t="Training, skills, boosters, full database"></small></button>
      <button class="quick" data-go="cards" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-9 9"/></svg><b data-t="Card studio"></b><small data-t="Backgrounds, card faces and player stats"></small></button>
      <button class="quick" data-go="saves" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v6h8V4M8 20v-6h8v6"/></svg><b data-t="Save manager"></b><small data-t="Level up, remove duplicates, import and export"></small></button>
      <button class="quick" data-go="storage" type="button"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg><b data-t="Storage cleanup"></b><small data-t="Scan usage and reclaim space"></small></button>
    </div>
    <details class="tips" id="tips">
      <summary data-t="Help"></summary>
      <p data-t="Progression / Form ABCD / Skills & Boosters / Player Catalogue"></p>
      <p data-t="资源缺失：安装离线资源包后Enter Game，自动Import。\n资源完整：直接进入。覆盖更新保留资源与Saves；请勿清除数据或卸载Main游戏。"></p>
      <p class="hl" data-t="如果遇到载入资源卡住 of 情况，请切一下到资源安装包到前台再切回去。\n如果游戏进入黑屏退出再进一次即可"></p>
      <button class="link" id="native-launcher" type="button">Compatibility interface</button>
    </details>
  </section>

  <section class="page" id="players" hidden><div id="ed-root"></div><button class="link" id="native-editor" type="button">Open native player editor</button></section>

  <section class="page" id="cards" hidden>
    <div class="hero-card">
      <h2 data-t="DIY Card Designer (Background & Card Art)"></h2>
      <p data-t="Import images, pick a background and set player stats, then generate a standalone player. Works are stored on this device."></p>
      <div class="chips-row"><span data-t="Import images"></span><span data-t="Pick background"></span><span data-t="Player stats"></span><span data-t="Generate & add"></span></div>
      <button class="row hot" id="open-designer" type="button"><span class="row-t"><b data-t="DIY Card Designer (Background & Card Art)"></b><small data-t="Open card studio"></small></span></button>
    </div>
  </section>

  <section class="page" id="saves" hidden>
    <div class="list">
      <button class="row hot" id="max-level" type="button"><span class="row-t"><b data-t="Max Level & Allocate Progression"></b><small data-t="Raise under-level players to their cap and auto-allocate points"></small></span></button>
      <button class="row" id="dedupe" type="button"><span class="row-t"><b data-t="Remove Duplicate Lower-Level Players"></b><small data-t="Preview first, then remove duplicate under-level players; backed up automatically"></small></span></button>
      <button class="row" id="export" type="button"><span class="row-t"><b data-t="Export Save"></b><small data-t="Creates an .efsave backup you can restore any time"></small></span></button>
      <button class="row" id="import" type="button"><span class="row-t"><b data-t="Import Save"></b><small data-t="Replaces current progress; backed up first"></small></span></button>
    </div>
    <p class="note" data-t="Importto替换Current进度；只接受本程序Export of  .efsave File。\nAfter entering the game, close and reopen it before managing saves."></p>
  </section>

  <section class="page" id="storage" hidden>
    <div class="list">
      <button class="row hot" id="open-storage" type="button"><span class="row-t"><b data-t="Storage管理 · 扫描与清理"></b><small data-t="Scan usage, preview, then clean selectively"></small></span></button>
      <button class="row" id="repair2" type="button"><span class="row-t"><b data-t="Check & Repair Resources"></b><small data-t="Re-verify and restore game resources"></small></span></button>
    </div>
  </section>
</main>

<nav class="dock" id="dock" aria-label="Navigation">
  <button data-page="home" class="on" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg><span data-t="Home"></span></button>
  <button data-page="players" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg><span data-t="Players"></span></button>
  <button data-page="cards" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-9 9"/></svg><span data-t="Cards"></span></button>
  <button data-page="saves" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v6h8V4M8 20v-6h8v6"/></svg><span data-t="Saves"></span></button>
  <button data-page="storage" type="button"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg><span data-t="Storage"></span></button>
</nav>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h2 id="sheet-title"></h2>
    <p class="body" id="sheet-body"></p>
    <div id="sheet-extra"></div>
    <div class="row-actions" id="sheet-actions"></div>
  </div>
</div>

<script src="launcher-startup.js"></script>
<script src="ui-locales.js"></script>
<script src="english-words.js"></script>
<script src="ui-localization.js"></script>
<script src="editor-core.js"></script>
<script src="editor-util.js"></script>
<script src="editor-store.js"></script>
<script src="editor-ui.js"></script>
<script src="editor-dev.js"></script>
<script src="editor-pos.js"></script>
<script src="editor-misc.js"></script>
<script src="editor-catalog.js"></script>
<script src="editor-compare.js"></script>
<script src="editor-private.js"></script>
<script src="editor-detail.js"></script>
<script src="editor-list.js"></script>
<script src="launcher.js"></script>
</body>
</html>
